# Builds and tests Eye Timer on every pull request and push to main.
#
# Releases follow the version in CMakeLists.txt: when main gets a version that
# has no vX.Y.Z tag yet (normally by merging the pull request that raised it),
# the run creates the tag and publishes the release. Pull requests that raise
# the version must add its changelog section and stay above the latest
# release. Pushing a vX.Y.Z tag by hand still publishes too.
#
# Actions are pinned to exact commits; update the SHA and the version comment
# together.
#
# Each successful build is recorded under the git tree hash of the code it
# built (a "tested-<tree>" artifact). When a later run sees exactly the same
# code, typically the push of a merged pull request that was up to date with
# main, or a tag on a commit main already built, it skips the build and a
# release publishes the installers from that earlier run. Anything that
# differs is built and tested again.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build even if this exact code was built before
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: "6.8.3"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tree: ${{ steps.reuse.outputs.tree }}
      reuse-run: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read and check the version
        id: version
        run: |
          version=$(sed -n 's/^project(EyeTimer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "::error file=CMakeLists.txt::no version in project(EyeTimer VERSION ...)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

          # The changelog and the version move together: its newest version
          # section must be this version (only [Unreleased] may sit above it).
          # A section the version doesn't announce would never be released.
          newest=$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ "$newest" != "$version" ]; then
            echo "::error file=CHANGELOG.md::the newest changelog section is [${newest:-none}] but CMakeLists.txt says $version. Raise the version to match, or keep the entries under [Unreleased]."
            exit 1
          fi

          # Published versions are the vX.Y.Z tags.
          tags=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+(\.[0-9]+)*$' || true)
          latest=$(printf '%s\n' "$tags" | sed '/^$/d' | sort -V | tail -1)
          if printf '%s\n' "$tags" | grep -qxF "$version"; then released=true; else released=false; fi
          echo "Latest release: ${latest:-none}; $version already released: $released"

          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the project version $version"
              exit 1
            fi
            release=true
          elif [ "$released" = false ]; then
            # A new version: it must move forward and come with release notes.
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
              echo "::error file=CMakeLists.txt::version $version is lower than the latest release $latest"
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              release=true
            elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::notice title=Release::Merging this pull request publishes Eye Timer $version."
            fi
          fi
          if { [ "$release" = true ] || [ "$released" = false ]; } && ! sh tools/changelog_section.sh "$version" > /dev/null; then
            echo "::error file=CHANGELOG.md::version $version needs a '## [$version] - YYYY-MM-DD' section"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Look for an earlier build of exactly this code
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild && 'true' || 'false' }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "Code tree: $tree"
          if [ "$REBUILD" = true ]; then
            echo "Rebuild requested."
            exit 0
          fi
          # A build is reused only from a run that checked out exactly this
          # tree. ci.yml is part of the tree, so the installers were made by
          # the same reviewed workflow that is running now, never by a branch
          # or fork whose own workflow could have produced anything.
          run=""
          candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tested-$tree&per_page=20" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id' | sort -u)
          for id in $candidates; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
              --jq '[.conclusion, .path, .head_repository.full_name, .head_sha] | @tsv' > run.tsv
            IFS=$'\t' read -r conclusion path head_repo head_sha < run.tsv
            if [ "$conclusion" != success ] || [ "$path" != .github/workflows/ci.yml ] \
               || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "Run $id: not a successful run of this workflow in this repository; ignored."
              continue
            fi
            head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq .tree.sha)
            if [ "$head_tree" != "$tree" ]; then
              echo "Run $id built commit $head_sha with different code; ignored."
              continue
            fi
            installers=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=50" --jq '
              [.artifacts[] | select(.expired | not) | .name
                            | select(. == "windows" or . == "linux" or . == "macos")] | length')
            if [ "$installers" != 3 ]; then
              echo "Run $id built this code, but its installers have expired; ignored."
              continue
            fi
            run=$id
            break
          done
          if [ -z "$run" ]; then
            echo "No earlier build of exactly this code; building it."
            exit 0
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "::notice title=Reusing an earlier build::This exact code was built and tested in run $run ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run), so the builds are skipped."

  windows:
    name: Windows
    needs: version
    if: needs.version.outputs.reuse-run == ''
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: set -o pipefail; cmake --build build 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: grep -E "error|Error|FAILED|undefined reference" build.log | head -10 | sed 's/^/::error::/' || true
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Bundle Qt and the MinGW (UCRT) runtime
        run: packaging/windows/deploy-msys2.sh build dist/EyeTimer
      - name: Smoke-test the bundle without MSYS2 on PATH
        shell: pwsh
        run: |
          & dist\EyeTimer\EyeTimer.exe --render-previews previews | Out-Null
          if (-not (Test-Path previews\rest-overlay.png)) { throw "the bundled app did not start" }
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc /Q "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceDir=$PWD\dist\EyeTimer" "/DOutputDir=$PWD\installer" packaging\windows\eye_timer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Test install, update and uninstall keep settings
        shell: pwsh
        run: |
          $setup = "installer\EyeTimer-windows-x64-setup.exe"
          $app = "$env:LOCALAPPDATA\Programs\Eye Timer"
          $settings = "$env:LOCALAPPDATA\EyeTimer\settings.json"
          New-Item -ItemType Directory -Force (Split-Path $settings) | Out-Null
          Set-Content $settings '{"rest_interval_seconds": 1500}'

          $startup = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\Eye Timer.lnk"

          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Test-Path "$app\EyeTimer.exe")) { throw "not installed per user in $app" }
          # A first install turns on start at sign-in for the installed copy.
          if (-not (Test-Path $startup)) { throw "no startup shortcut after a first install" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($startup).TargetPath
          if ($target -ne "$app\EyeTimer.exe") { throw "startup shortcut points at $target" }
          if ((Get-Content $settings -Raw | ConvertFrom-Json).start_with_boot -ne $true) { throw "start_with_boot not saved" }
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Test-Path "$app\EyeTimer.exe")) { throw "update removed the app" }

          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\EyeTimer.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\EyeTimer.exe") { throw "uninstall left the app behind" }
          if (Test-Path $startup) { throw "uninstall left the startup shortcut behind" }
          if ((Get-Content $settings -Raw) -notmatch '1500') { throw "settings were changed or removed" }
          Write-Host "Per-user install, start at sign-in, update and uninstall OK; settings kept."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: installer/EyeTimer-windows-x64-setup.exe
          retention-days: ${{ github.ref_type == 'tag' && 30 || 7 }}

  linux:
    name: Linux
    needs: version
    if: needs.version.outputs.reuse-run == ''
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ dpkg-dev file \
            qt6-base-dev qt6-multimedia-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: grep -E "error|Error|FAILED|undefined reference" build.log | head -10 | sed 's/^/::error::/' || true
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Build the Debian package
        run: |
          (cd build && cpack)
          mkdir -p dist
          cp build/eye-timer_*_amd64.deb dist/EyeTimer-linux-amd64.deb
          dpkg-deb --info dist/EyeTimer-linux-amd64.deb
      - name: Test install, upgrade and removal keep settings
        run: |
          settings="$HOME/.local/share/EyeTimer/settings.json"
          mkdir -p "$(dirname "$settings")"
          echo '{"rest_interval_seconds": 1500}' > "$settings"

          sudo apt-get install -y ./dist/EyeTimer-linux-amd64.deb
          EyeTimer --render-previews /tmp/previews
          test -f /tmp/previews/rest-overlay.png
          sudo apt-get install -y --reinstall ./dist/EyeTimer-linux-amd64.deb
          sudo apt-get remove -y eye-timer
          ! command -v EyeTimer
          grep -q 1500 "$settings" || { echo "::error::settings were changed or removed"; exit 1; }
          echo "Install, upgrade and removal OK; settings kept."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/EyeTimer-linux-amd64.deb
          retention-days: ${{ github.ref_type == 'tag' && 30 || 7 }}

  macos:
    name: macOS
    needs: version
    if: needs.version.outputs.reuse-run == ''
    runs-on: macos-15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Install Ninja
        run: brew install ninja
      - name: Configure (universal arm64 + x86_64)
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build
        shell: bash
        run: cmake --build build 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: grep -E "error|Error|FAILED|undefined reference" build.log | head -10 | sed 's/^/::error::/' || true
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Bundle Qt into the app
        run: |
          macdeployqt "build/Eye Timer.app" -verbose=1
          # Ad hoc signature only: there is no Developer ID yet.
          codesign --force --deep --sign - "build/Eye Timer.app"
          lipo -info "build/Eye Timer.app/Contents/MacOS/Eye Timer"
      - name: Smoke-test the bundle
        run: |
          "build/Eye Timer.app/Contents/MacOS/Eye Timer" --render-previews previews
          test -f previews/rest-overlay.png
      - name: Build the disk image
        run: packaging/macos/make-dmg.sh "build/Eye Timer.app" dist/EyeTimer-macos.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/EyeTimer-macos.dmg
          retention-days: ${{ github.ref_type == 'tag' && 30 || 7 }}

  # The one check to require in branch protection. It always runs, so a
  # failed or cancelled build fails it; a skipped job would count as passing.
  tested:
    name: Tested
    if: always()
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check every build passed or was reused
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          REUSED_RUN: ${{ needs.version.outputs.reuse-run }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.linux.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          echo "Version: $VERSION_RESULT, Windows: $WINDOWS, Linux: $LINUX, macOS: $MACOS"
          if [ "$VERSION_RESULT" != success ]; then
            echo "::error::the version checks failed"
            exit 1
          fi
          if [ -n "$REUSED_RUN" ]; then
            echo "Built and tested earlier in run $REUSED_RUN."
            exit 0
          fi
          if [ "$WINDOWS" != success ] || [ "$LINUX" != success ] || [ "$MACOS" != success ]; then
            echo "::error::not every platform built and passed"
            exit 1
          fi
      - name: Record that this code built and passed everywhere
        if: needs.version.outputs.reuse-run == ''
        run: echo "${{ github.run_id }}" > tested.txt
      - if: needs.version.outputs.reuse-run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-${{ needs.version.outputs.tree }}
          path: tested.txt
          retention-days: ${{ github.ref_type == 'tag' && 30 || 7 }}

  release:
    name: Release
    # Explicit status checks: a plain condition implicitly requires every
    # upstream job to have succeeded, and the platform jobs behind Tested are
    # skipped when an earlier build is reused.
    if: >-
      !cancelled() && needs.version.outputs.release == 'true'
      && needs.version.result == 'success' && needs.tested.result == 'success'
    needs: [version, tested]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; tag a commit from main to release"
            exit 1
          fi
      - name: Download the installers (from this run or the earlier build)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{windows,linux,macos}"
          merge-multiple: true
          run-id: ${{ needs.version.outputs.reuse-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Write checksums and release notes
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            sh tools/changelog_section.sh "$VERSION"
            echo
            cat packaging/release-downloads.md
          } > notes.md
      - name: Publish the release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --title "Eye Timer $VERSION" --notes-file notes.md
          else
            # Creates the vX.Y.Z tag on this commit of main. Tags created with
            # the workflow's token start no new workflow run.
            gh release create "v$VERSION" dist/* \
              --target "$GITHUB_SHA" --title "Eye Timer $VERSION" --notes-file notes.md
          fi
